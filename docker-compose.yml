services:

  # NextJS webserver
  apex:
    build:
      context: ./apex
    networks:
        - internal

  # Blog
  blog:
    build:
      context: ./blog
    networks:
      - internal
    ports:
      - 8000:80

  # LLM
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - 3000:8080
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - searxng
    networks:
      - external
      - search

  # SearXNG
  searxng:
    image: searxng/searxng:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./searxng:/etc/searxng:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - search
      - searxng-egress

  # NGinx reverse proxy
  nginx:
    image: nginx:alpine

    depends_on:
      - apex
      - blog
      - open-webui

    ports:
      - 443:443
    networks:
      - internal
      - external

    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./nginx/snippets/:/etc/nginx/snippets/:ro
      - ./nginx/favicons/:/favicons/:ro

      - /etc/letsencrypt/live/skoh.dev/fullchain.pem:/etc/ssl/skoh-dev/fullchain.pem:ro
      - /etc/letsencrypt/live/skoh.dev/privkey.pem:/etc/ssl/skoh-dev/privkey.pem:ro



networks:
  internal:
    internal: true
  external:
  search:
    internal: true
  searxng-egress:

volumes:
  open-webui:
