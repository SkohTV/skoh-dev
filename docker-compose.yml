services:

  # NextJS webserver
  apex:
    build:
      context: ./apex
    networks:
        - internal

  # Blog
  blog:
    build:
      context: ./blog
    networks:
      - internal
    ports:
      - 8000:80


  # NGinx reverse proxy
  nginx:
    image: nginx:alpine

    depends_on:
      - apex
      - blog

    ports:
      - 443:443
    networks:
      - internal
      - external

    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./nginx/snippets/:/etc/nginx/snippets/:ro
      - ./nginx/favicons/:/favicons/:ro

      - /etc/letsencrypt/live/skoh.dev/fullchain.pem:/etc/ssl/skoh-dev/fullchain.pem:ro
      - /etc/letsencrypt/live/skoh.dev/privkey.pem:/etc/ssl/skoh-dev/privkey.pem:ro



networks:
  internal:
    internal: true
  external:
